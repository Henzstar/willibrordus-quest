<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Willibrordus Quest · bord</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="./css/style.css">
<style>
  /* Schermmodus: kaart groot, klok en URL eromheen. Fase 2 voegt teams en ranglijst toe. */
  body { overflow: hidden; }
  .beamer { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding: 16px 24px; }
  .beamer .balk { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .beamer h1 { font-size: clamp(16px, 2.4vw, 32px); }
  .beamer .klok { font-family: var(--display); font-size: clamp(24px, 4vw, 56px); color: var(--fg); }
  .beamer .klok.bijna { color: var(--warn); }
  .beamer .klok.om { color: var(--bad); }
  .beamer .screen { align-self: center; justify-self: center; max-width: 100%; max-height: 100%; }
  .beamer canvas { width: min(calc(100vw - 48px), calc((100vh - 230px) * 768 / 352)); height: auto; }
  .beamer .url { font-family: var(--display); font-size: clamp(16px, 2.6vw, 36px); color: var(--accent); text-align: center; word-break: break-all; }
  .beamer .sub { text-align: center; }
</style>
</head>
<body>
<div class="beamer">
  <div class="balk">
    <div><h1 id="titel">Willibrordus Quest</h1><p class="sub" id="ondertitel" style="text-align:left">Wie stuurt?</p></div>
    <div class="klok" id="klok">--:--</div>
  </div>
  <div class="screen"><canvas id="kaart" width="768" height="352" aria-label="Kaart van het landgoed"></canvas></div>
  <div>
    <div class="url" id="url"></div>
    <p class="sub" id="hint">Open de link op één telefoon per team.</p>
  </div>
</div>
<script src="./js/config.js"></script>
<script src="./js/content.js"></script>
<script src="./js/tiles.js"></script>
<script src="./js/gebouwen.js"></script>
<script src="./js/sprites.js"></script>
<script src="./js/map.js"></script>
<script src="./js/interior.js"></script>
<script>
(() => {
  'use strict';
  const q = new URLSearchParams(location.search);
  document.getElementById('titel').textContent = CONTENT.titel;
  document.getElementById('ondertitel').textContent = CONTENT.ondertitel;
  document.getElementById('url').textContent = location.href.replace(/beamer\.html.*$/, '').replace(/^https?:\/\//, '');
  WQWereld.init(CONTENT);
  WQMap.init(document.getElementById('kaart'), { fullMap: true });
  WQMap.setWereld(WQWereld.buitenWereld(() => false, null), CONTENT.locaties[0].tegel[0], CONTENT.locaties[0].tegel[1]);
  WQMap.setHeroVisible(false);

  // Klok: &min=30 telt af vanaf het laden; zonder min toont hij de tijd.
  const klok = document.getElementById('klok');
  const minuten = parseInt(q.get('min'), 10);
  const eind = minuten > 0 ? Date.now() + minuten * 60000 : null;
  const pad = n => String(n).padStart(2, '0');
  function tik() {
    if (!eind) { const d = new Date(); klok.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()); return; }
    const rest = Math.max(0, Math.round((eind - Date.now()) / 1000));
    klok.textContent = pad(Math.floor(rest / 60)) + ':' + pad(rest % 60);
    klok.className = 'klok' + (rest === 0 ? ' om' : rest < 300 ? ' bijna' : '');
  }
  tik(); setInterval(tik, 1000);
})();
</script>
</body>
</html>
